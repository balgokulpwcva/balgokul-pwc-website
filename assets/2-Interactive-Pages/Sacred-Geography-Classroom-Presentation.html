<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sacred Geography Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;700&display=swap">
<style>
/* Layout: app chrome (theme-aware) around a lamp-lit indigo "stage" that stays dark for projectors. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#1d2333; --muted:#5a6273; --line:#d5dae2;
  --accent:#1d6b74; --accent-ink:#ffffff; --mark:#b8790a;
  --stage:#1b2238; --stage2:#252e4b; --stage3:#313b5d; --sink:#f3eee3; --smuted:#bdb6a8;
  --gold:#f2b134; --teal:#6fcfc6; --good:#86d9a1; --bad:#f0907a;
  --display:"Yatra One","Mukta",Georgia,serif; --body:"Mukta","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131d; --surface:#171d2b; --ink:#e7e9ef; --muted:#9ba2b3; --line:#283044;
  --accent:#6cc5bd; --accent-ink:#0f131d; --mark:#f2b134; --stage:#141a2c; --stage2:#1f2741; --stage3:#2a3352; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131d; --surface:#171d2b; --ink:#e7e9ef; --muted:#9ba2b3; --line:#283044;
  --accent:#6cc5bd; --accent-ink:#0f131d; --mark:#f2b134; --stage:#141a2c; --stage2:#1f2741; --stage3:#2a3352; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;color:var(--ink)}
.brand span{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select.btn{max-width:260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.today{background:var(--stage);color:var(--sink);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:10px;min-width:0}
.today .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700}
.today h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,48px);line-height:1.1;margin:0;text-wrap:balance}
.today p{margin:0;color:var(--smuted);max-width:60ch}
.today .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.today .btn{background:var(--gold);border-color:var(--gold);color:#1b2238;font-weight:700}
.today .btn.ghost{background:transparent;color:var(--sink);border-color:var(--stage3)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.about h2{margin:0;font-size:18px}
.about p,.about li{color:var(--muted);margin:0}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.year h2{font-family:var(--display);font-weight:400;font-size:28px;margin:8px 0 4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.month h3{margin:0 0 4px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:8px;border-radius:8px;text-align:left;border:0;background:transparent;width:100%}
button.day:hover{background:var(--bg)}
.day .d{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;line-height:1;color:var(--ink)}
.day .d small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.day .t{font-weight:500;line-height:1.25}
.day .t em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.day.off .t{color:var(--muted);font-weight:400}
.day.now{background:color-mix(in srgb,var(--mark) 16%,transparent);outline:2px solid var(--mark)}
.day.past .d,.day.past .t{opacity:.62}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--mark);color:#1b2238;margin-left:6px;vertical-align:2px}
/* Class view */
.runbar{display:flex;gap:4px;flex-wrap:wrap}
.runbar button{flex:1 1 90px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;text-align:left;line-height:1.15;min-width:0}
.runbar button b{display:block;font-size:13px}
.runbar button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.runbar button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.stagewrap{position:relative}
.stage{container-type:inline-size;background:var(--stage);color:var(--sink);border-radius:14px;aspect-ratio:16/9;width:100%;padding:3.6cqw 4.4cqw;display:flex;flex-direction:column;gap:1.4cqw;font-size:max(15px,1.75cqw);position:relative}
.stagewrap:fullscreen{background:var(--stage);display:flex;align-items:center;justify-content:center}
.stagewrap:fullscreen .stage{border-radius:0;max-width:calc(100vh*16/9);overflow:auto}
.s-eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:.72em}
.s-h{font-family:var(--display);font-weight:400;font-size:2.3em;line-height:1.08;margin:0;text-wrap:balance}
.s-sub{color:var(--smuted);margin:0;font-size:1.05em;max-width:62ch}
.clock{position:absolute;right:3cqw;top:2.6cqw;display:flex;gap:.4em;align-items:center;font-variant-numeric:tabular-nums}
.clock button{background:var(--stage2);border:1px solid var(--stage3);border-radius:99px;padding:.2em .8em;color:var(--sink);font-size:.8em;font-weight:700}
.clock button.done{background:var(--gold);color:#1b2238;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.6}}
@media (prefers-reduced-motion:reduce){.clock button.done{animation:none}}
.grow{flex:1;min-height:0}
/* title slide */
.t-grid{display:grid;grid-template-columns:1fr auto;gap:3cqw;align-items:center;flex:1}
.t-num{font-family:var(--display);color:var(--gold);font-size:1.3em}
.t-title{font-family:var(--display);font-size:3.4em;line-height:1.02;margin:.15em 0 .3em;text-wrap:balance}
.t-meta{color:var(--smuted);font-size:1.05em}
.stamp{width:13cqw;height:13cqw;min-width:110px;min-height:110px;border:.35cqw dashed var(--gold);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);color:var(--gold);text-align:center;gap:.2em}
.stamp b{font-family:var(--display);font-weight:400;font-size:1.15em;letter-spacing:.06em;line-height:1}
.stamp small{font-size:.55em;letter-spacing:.2em;text-transform:uppercase}
.runrow{display:flex;gap:.5em;flex-wrap:wrap}
.runrow span{background:var(--stage2);border-radius:99px;padding:.15em .8em;font-size:.8em}
.runrow span b{color:var(--gold)}
/* wonder */
.wonder{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1em}
.wonder .q{font-family:var(--display);font-size:3em;line-height:1.1;max-width:24ch;text-wrap:balance;margin:0}
.wonder .hint{display:inline-flex;gap:.5em;align-items:center;background:var(--stage2);border-radius:99px;padding:.3em 1em;font-weight:700;color:var(--teal);align-self:flex-start;font-size:.85em}
/* learn */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2cqw}
.card{background:var(--stage2);border-radius:10px;padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.3em}
.card h3{margin:0;font-size:1.05em;color:var(--gold)}
.card p{margin:0;font-size:.9em;line-height:1.4}
.vocab{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.vocab .lbl{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--smuted);font-weight:700}
.chip{background:transparent;border:1px solid var(--teal);color:var(--sink);border-radius:8px;padding:.25em .7em;font-size:.82em;text-align:left;line-height:1.2}
.chip b{color:var(--teal)}
.chip small{display:block;color:var(--smuted);font-size:.85em}
.chip i{font-style:normal;color:var(--gold)}
.learnrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.6cqw;align-items:start}
.diagram svg{width:100%;height:auto;display:block}
/* map */
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2cqw;flex:1;min-height:0}
.mapbox{background:var(--stage2);border-radius:10px;padding:.6cqw;display:flex;align-items:flex-start;justify-content:center;min-height:0;align-self:start}
.mapbox svg{width:100%;height:auto;max-height:40cqw;display:block}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:.4em;min-width:0;align-content:start}
.legend button{display:grid;grid-template-columns:1.7em 1fr;gap:.6em;align-items:start;text-align:left;background:var(--stage2);border:1px solid transparent;border-radius:8px;padding:.45em .7em;color:var(--sink);font-size:.86em;line-height:1.25}
.legend button[aria-pressed="true"]{border-color:var(--gold)}
.legend .n{display:inline-flex;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:#1b2238;font-weight:700;align-items:center;justify-content:center;font-size:.85em}
.legend small{display:block;color:var(--smuted)}
.legend .blurb{display:block;color:var(--sink);margin-top:.2em}
/* explore */
.exrow{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:2cqw;flex:1;min-height:0}
.excol{display:flex;flex-direction:column;gap:.8em;min-width:0}
.box{background:var(--stage2);border-radius:10px;padding:1em 1.1em}
.box h4{margin:0 0 .25em;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--smuted)}
.box p{margin:0;font-size:.92em}
.box.path{border-left:.3em solid var(--teal)}
.gametabs{display:flex;gap:.4em;flex-wrap:wrap}
.gametabs button{background:transparent;border:1px solid var(--stage3);color:var(--smuted);border-radius:99px;padding:.2em .9em;font-size:.82em;font-weight:700}
.gametabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#1b2238}
.game{background:var(--stage2);border-radius:10px;padding:1em;display:flex;flex-direction:column;gap:.7em;flex:1;min-height:0}
.game .ghead{display:flex;justify-content:space-between;gap:1em;align-items:center;flex-wrap:wrap}
.game .ghead b{font-size:1em}
.game .status{color:var(--teal);font-weight:700;font-size:.85em}
.gbtn{background:var(--stage3);border:0;color:var(--sink);border-radius:8px;padding:.3em .8em;font-size:.82em;font-weight:700}
.tok{background:var(--stage);border:1px solid var(--stage3);color:var(--sink);border-radius:8px;padding:.35em .7em;font-size:.85em;text-align:left;line-height:1.2}
.tok.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tok.ok{border-color:var(--good);color:var(--good);cursor:default}
.tok.no{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.tok.no{animation:none}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.match .col{display:flex;flex-direction:column;gap:.4em}
.pool{display:flex;flex-wrap:wrap;gap:.4em}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.5em}
.bucket{background:var(--stage);border:1px dashed var(--stage3);border-radius:8px;padding:.5em;min-height:4em;display:flex;flex-direction:column;gap:.35em;text-align:left;color:var(--sink)}
.bucket>b{font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.bucket.armed{border-color:var(--gold);border-style:solid}
.bucket .tok{font-size:.78em}
.order{display:flex;flex-direction:column;gap:.35em;padding:0;margin:0;list-style:none}
.order li{display:grid;grid-template-columns:1.6em 1fr auto;gap:.5em;align-items:center;background:var(--stage);border:1px solid var(--stage3);border-radius:8px;padding:.3em .5em;font-size:.88em}
.order li.ok{border-color:var(--good)}
.order li.no{border-color:var(--bad)}
.order li .i{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.order li button{background:var(--stage3);border:0;border-radius:6px;color:var(--sink);padding:.05em .45em;margin-left:.2em}
.find{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:1em;align-items:center;min-height:0}
.find svg{width:100%;height:auto;max-height:30cqw;display:block}
.find .prompt{font-family:var(--display);font-size:1.5em;color:var(--gold);line-height:1.1}
.checklist{display:flex;flex-direction:column;gap:.35em}
.checklist label{display:flex;gap:.6em;align-items:center;background:var(--stage);border:1px solid var(--stage3);border-radius:8px;padding:.35em .6em;font-size:.9em;cursor:pointer}
.checklist input{width:1.1em;height:1.1em;accent-color:var(--teal)}
.checklist small{color:var(--smuted);margin-left:auto;font-size:.75em;text-transform:uppercase;letter-spacing:.08em}
.gop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1em;align-items:center}
.gop svg{width:100%;max-height:27cqw}
.gop .ctl{display:flex;flex-direction:column;gap:.6em;font-size:.85em}
.swatches{display:flex;gap:.3em;flex-wrap:wrap;max-width:9em}
.swatches button{width:1.6em;height:1.6em;border-radius:50%;border:2px solid var(--stage3)}
.swatches button[aria-pressed="true"]{border-color:var(--sink)}
/* quiz */
.quiz{flex:1;display:flex;flex-direction:column;gap:1em;justify-content:center;max-width:56em}
.quiz .qn{color:var(--smuted);font-size:.8em;letter-spacing:.12em;text-transform:uppercase;font-weight:700;font-variant-numeric:tabular-nums}
.quiz .qq{font-family:var(--display);font-size:2em;line-height:1.12;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.opt{background:var(--stage2);border:2px solid var(--stage3);border-radius:10px;padding:.7em 1em;text-align:left;color:var(--sink);display:grid;grid-template-columns:1.7em 1fr;gap:.5em;align-items:center;font-size:.95em}
.opt .k{width:1.6em;height:1.6em;border-radius:50%;background:var(--stage3);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.opt.ok{border-color:var(--good)}
.opt.ok .k{background:var(--good);color:#1b2238}
.opt.no{border-color:var(--bad)}
.opt.no .k{background:var(--bad);color:#1b2238}
.why{margin:0;color:var(--teal);font-weight:500;min-height:1.4em}
.qnav{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
/* reflect */
.reflect{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2cqw;flex:1;align-items:stretch}
.passport{background:var(--sink);color:#1b2238;border-radius:10px;padding:1.6cqw;display:flex;flex-direction:column;gap:.6em;position:relative}
.passport h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.4em}
.passport .lines{flex:1;background:repeating-linear-gradient(transparent 0 1.9em,#c9c1b0 1.9em calc(1.9em + 1px));min-height:6em}
.passport .stamp{position:absolute;right:1.4cqw;top:1.2cqw;width:9cqw;height:9cqw;min-width:80px;min-height:80px;color:#a8660a;border-color:#a8660a;font-size:.8em}
.nextup{display:flex;flex-direction:column;gap:.8em}
/* bottom controls */
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .sp{flex:1}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.notes h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.notes p{margin:0;max-width:75ch}
.note-sm{font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .stage{aspect-ratio:auto;font-size:15px;padding:18px;gap:14px}
  .clock{position:static;align-self:flex-end}
  .t-grid,.learnrow,.maprow,.exrow,.reflect,.find,.gop{grid-template-columns:1fr}
  .cards,.opts,.match{grid-template-columns:1fr}
  .stamp{width:110px;height:110px}
  .mapbox svg,.find svg{max-height:none}
  .t-title{font-size:2.2em}.wonder .q{font-size:2em}.s-h{font-size:1.8em}
}
</style></head><body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" style="background:none;border:0;padding:0;text-align:left"><b>Sacred Geography</b><span>Bal Gokul · 2026–27 · Grades 9–12</span></button>
    <div class="controls">
      <select class="btn" id="clsSel" aria-label="Choose a class"></select>
    </div>
  </header>
  <main id="main"></main>

{cls:"13",date:"2027-02-07",unit:3,title:"Shakti Peethas and Goddess Traditions",stamp:"SHAKTI",sites:["kamakhya","kalighat","vaishno","kanchipuram"],
 wonder:{q:"What can goddess traditions tell us about how power and the divine are imagined?",sub:""},
 learn:[
  ["Shakti and Devi","Shakti means power or energy. Shakta traditions worship the Goddess (Devi) as supreme, in forms from fierce (Kali, Durga) to nurturing (Lakshmi, Parvati)."],
  ["The Shakti Peetha story","Sati’s death and Shiva’s grief scatter her body across the land; each place becomes a seat (peetha) of the Goddess. Texts give 4, 18, 51, 52 or 108 sites."],
  ["Case studies","Kamakhya (Guwahati) is a major Tantric center; Kalighat (Kolkata) honors Kali; Vaishno Devi is a mountain cave shrine in Jammu; Kamakshi Amman is in Kanchipuram."],
  ["Mapping power","The story turns the whole subcontinent into the Goddess’s body. Scholars read this as a way of uniting distant regional goddesses into one network."]],
 vocab:[["Shakta","SHAAK-ta","devotee of the Goddess"],["peetha","PEE-tha","seat"],["Tantra","TUN-tra","ritual and esoteric tradition"]],
 explore:{shared:"Compare images, landscapes and community descriptions of the four shrines.",
  task:"Compare two Shakti Peetha lists from different texts or traditions. Explain at least two reasons lists differ (region, sect, era, politics of pilgrimage).",
  discuss:"What does it mean for a land to be imagined as a goddess’s body? Compare with other traditions that sanctify land.",
  games:[{t:"match",title:"Shrine and setting",pairs:[["Kamakhya","Hilltop above the Brahmaputra, Tantric center"],["Kalighat","Kolkata, beside the old Hooghly channel"],["Vaishno Devi","Cave shrine in the Trikuta mountains"],["Kamakshi Amman","Temple town of Kanchipuram"]]},
         {t:"find",title:"Find the Goddess shrines",sites:["kamakhya","kalighat","vaishno","kanchipuram"]}]},
 quiz:[["Shakta traditions treat the Goddess as…","Supreme divine power",["A minor helper","A historical queen","A river only"],"Shakti is the ultimate reality."],
  ["Why do Shakti Peetha counts vary (4 to 108)?","Different texts, regions and sects list different sites",["Temples move","Typos","They don’t vary"],"Diversity within one tradition."],
  ["Which shrine is a major Tantric center?","Kamakhya",["Vaishno Devi","Kalighat","Kamakshi Amman"],"On Nilachal Hill in Guwahati."],
  ["How do scholars read the scattered-body story?","As linking regional goddesses into one network",["As a medical text","As a battle record","As a recipe"],"Geography becomes theology."]],
 reflect:{hs:"Answer: what does diversity within one tradition look like? Use evidence from today."},
 notes:{l:"Tell the Sati story briefly and with care.",r:"No class Feb 14. Next class Feb 21."}},

  if(k==="quiz")return `<div class="s-eyebrow">Quick quiz</div><div class="quiz" id="quiz"></div>`;
  if(k==="reflect"){const nx=S[state.si+1];
    return head("Reflect","Passport time")+`<div class="reflect"><div class="passport"><div class="stamp" aria-hidden="true"><small>Passport</small><b>${esc(s.stamp)}</b><small>${pd(s.date).getFullYear()}</small></div>
      <h3>Reflection</h3><p style="margin:0;max-width:34ch;font-size:1.05em">${esc(s.reflect.hs||s.reflect.mid)}</p><div class="lines"></div></div>
      <div class="nextup"><div class="box"><h4>Exit ticket</h4><p>One word that describes today’s place, and one question you still have.</p></div>
      ${nx?`<div class="box"><h4>Next class · ${longDate(nx.date)}</h4><p><b>Class ${nx.cls}:</b> ${esc(nx.title)}</p></div>`:`<div class="box"><h4>Thank you!</h4><p>Congratulations on completing Sacred Geography.</p></div>`}</div></div>`}
  return "";
}

/* ---------- Wiring ---------- */
function wireSlide(s,k){
  const tb=$("#tbtn");if(tb)tb.onclick=()=>{if(timer.left<=0)return;if(timer.run){clearInterval(timer.id);timer.run=false;tb.textContent="▶ "+fmt(timer.left)}else{timer.run=true;tb.textContent="❚❚ "+fmt(timer.left);timer.id=setInterval(tick,1000)}};
  const tr=$("#treset");if(tr)tr.onclick=()=>{clearInterval(timer.id);timer.key="";renderClass()};
  document.querySelectorAll("[data-slide]").forEach(b=>b.onclick=()=>go(+b.dataset.slide));
  $("#prev").onclick=()=>go(state.slide-1);$("#next").onclick=()=>go(state.slide+1);
  $("#home2").onclick=()=>{state.view="home";render()};
  $("#nt").onclick=()=>{state.notes=!state.notes;store.set("notes",state.notes);renderClass()};
  $("#fs").onclick=()=>{const el=$("#sw");try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}};
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const sm=c.querySelector("small");sm.hidden=!sm.hidden});
  if(k==="map"){const pick=key=>{document.querySelectorAll(".legend button").forEach(b=>{const on=b.dataset.site===key;b.setAttribute("aria-pressed",on);b.querySelector(".blurb").hidden=!on});document.querySelectorAll(".mapbox .dot").forEach(d=>d.setAttribute("fill",d.parentNode.dataset.k===key?"#6fcfc6":"#f2b134"))};
    document.querySelectorAll(".legend button").forEach(b=>b.onclick=()=>pick(b.dataset.site));
    document.querySelectorAll(".mapbox .pin").forEach(p=>{p.onclick=()=>pick(p.dataset.k);p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(p.dataset.k)}}});
    pick(s.sites[0])}
  if(k==="explore"){const show=i=>{document.querySelectorAll(".gametabs button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.g===i));runGame(s.explore.games[i],$("#game"))};
    document.querySelectorAll(".gametabs button").forEach(b=>b.onclick=()=>show(+b.dataset.g));show(0)}
  if(k==="quiz")runQuiz(s,$("#quiz"));
}
function go(i){const n=slidesFor(S[state.si]).length;if(i<0){if(state.si>0){state.si--;state.slide=slidesFor(S[state.si]).length-1}else return}else if(i>=n){if(state.si<S.length-1){state.si++;state.slide=0}else return}else state.slide=i;renderClass();window.scrollTo({top:0,behavior:"auto"})}

/* ---------- Games ---------- */
function runGame(g,el){
  const head=(extra="")=>`<div class="ghead"><b>${esc(g.title)}</b><span class="status" id="gst"></span>${extra}<button class="gbtn" id="greset">Reset</button></div>`;
  const reset=()=>runGame(g,el);
  if(g.t==="match"){const L=shuffle(g.pairs.map((p,i)=>[p[0],i]),hash(g.title)),R=shuffle(g.pairs.map((p,i)=>[p[1],i]),hash(g.title)+7);
    el.innerHTML=head()+`<div class="match"><div class="col">${L.map(([t,i])=>`<button class="tok" data-side="L" data-i="${i}">${esc(t)}</button>`).join("")}</div><div class="col">${R.map(([t,i])=>`<button class="tok" data-side="R" data-i="${i}">${esc(t)}</button>`).join("")}</div></div>`;
    let sel=null,done=0;const st=$("#gst",el);st.textContent=`0 / ${g.pairs.length}`;
    el.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{if(b.classList.contains("ok"))return;
      if(!sel||sel.dataset.side===b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
      if(sel.dataset.i===b.dataset.i){sel.classList.remove("sel");sel.classList.add("ok");b.classList.add("ok");done++;st.textContent=done===g.pairs.length?"All matched!":`${done} / ${g.pairs.length}`}
      else{const a=sel;[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("no");setTimeout(()=>x.classList.remove("no"),400)})}sel=null})}
  if(g.t==="sort"){const items=shuffle(g.items.map((x,i)=>({t:x[0],b:x[1],i})),hash(g.title));
    el.innerHTML=head()+`<p class="note-sm" style="margin:0;color:var(--smuted)">Tap a card, then tap the group it belongs in.</p><div class="pool" id="pool">${items.map(x=>`<button class="tok" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div><div class="buckets">${g.buckets.map((b,i)=>`<button class="bucket" data-b="${i}"><b>${esc(b)}</b></button>`).join("")}</div>`;
    let sel=null,done=0;const st=$("#gst",el);st.textContent=`0 / ${items.length}`;
    el.querySelectorAll("#pool .tok").forEach(t=>t.onclick=()=>{if(sel)sel.classList.remove("sel");sel=t;t.classList.add("sel");el.querySelectorAll(".bucket").forEach(b=>b.classList.add("armed"))});
    el.querySelectorAll(".bucket").forEach(b=>b.onclick=()=>{if(!sel)return;const it=g.items[+sel.dataset.i];el.querySelectorAll(".bucket").forEach(x=>x.classList.remove("armed"));
      if(it[1]===+b.dataset.b){sel.classList.remove("sel");sel.classList.add("ok");sel.onclick=null;b.appendChild(sel);done++;st.textContent=done===items.length?"All sorted!":`${done} / ${items.length}`}
      else{const x=sel;x.classList.remove("sel");x.classList.add("no");setTimeout(()=>x.classList.remove("no"),400);st.textContent="Try another group"}sel=null})}
  if(g.t==="order"){let cur=shuffle(g.items.map((t,i)=>i),hash(g.title));if(cur.every((v,i)=>v===i))cur.reverse();
    const draw=(check)=>{el.innerHTML=head()+`<ol class="order">${cur.map((v,p)=>`<li class="${check?(v===p?"ok":"no"):""}"><span class="i">${p+1}</span><span>${esc(g.items[v])}</span><span><button data-u="${p}" aria-label="Move up">↑</button><button data-d="${p}" aria-label="Move down">↓</button></span></li>`).join("")}</ol><div><button class="gbtn" id="gcheck">Check order</button></div>`;
      el.querySelector("#greset").onclick=reset;
      if(check){const n=cur.filter((v,p)=>v===p).length;$("#gst",el).textContent=n===cur.length?"Perfect order!":`${n} of ${cur.length} in place`}
      el.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const p=+b.dataset.u;if(p>0){[cur[p-1],cur[p]]=[cur[p],cur[p-1]];draw(false)}});
      el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const p=+b.dataset.d;if(p<cur.length-1){[cur[p+1],cur[p]]=[cur[p],cur[p+1]];draw(false)}});
      el.querySelector("#gcheck").onclick=()=>draw(true)};draw(false);return}
  if(g.t==="find"){const q=shuffle(g.sites,hash(g.title));let n=0,score=0,miss=false;
    el.innerHTML=head()+`<div class="find"><div>${mapSVG(g.sites,{numbered:false,showAll:false})}</div><div><div class="note-sm" style="color:var(--smuted)">Tap the dot for:</div><div class="prompt" id="fp"></div><p class="why" id="fw"></p></div></div>`;
    const fp=$("#fp",el),fw=$("#fw",el),st=$("#gst",el);
    const ask=()=>{if(n>=q.length){fp.textContent="All found!";st.textContent=`${score} / ${q.length} first try`;return}fp.textContent=SITES[q[n]].n;miss=false;st.textContent=`${n} / ${q.length}`};
    el.querySelectorAll(".pin").forEach(p=>{const act=()=>{if(n>=q.length)return;if(p.dataset.k===q[n]){p.querySelector(".lab").setAttribute("visibility","visible");p.querySelector(".dot").setAttribute("fill","#86d9a1");if(!miss)score++;fw.textContent=SITES[q[n]].b;n++;ask()}else{miss=true;fw.textContent="Not quite. Look again!";const d=p.querySelector(".dot");d.setAttribute("fill","#f0907a");setTimeout(()=>{if(d.getAttribute("fill")==="#f0907a")d.setAttribute("fill","#f2b134")},500)}};p.onclick=act;p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}}});ask()}
  if(g.t==="check"){const its=g.items;
    el.innerHTML=head()+`<div class="checklist">${its.map((x,i)=>`<label for="ck${i}"><input type="checkbox" id="ck${i}"><span>${esc(x[0])}</span></label>`).join("")}</div>`;
    const st=$("#gst",el);const up=()=>{const c=el.querySelectorAll("input:checked").length;st.textContent=c===its.length?"Ready to exhibit!":`${c} / ${its.length}`};el.querySelectorAll("input").forEach(i=>i.onchange=up);up()}
  if(g.t==="gopuram"){let tiers=6,col=0;const PAL=[["#e86a4a","#f2b134","#6fcfc6"],["#7d6bd8","#f2b134","#86d9a1"],["#3e9ad6","#f0907a","#f3eee3"],["#d84f8c","#6fcfc6","#f2b134"]];
    const draw=()=>{const W=260,base=200,th=Math.min(34,300/tiers);let sv="";const p=PAL[col];
      for(let i=0;i<tiers;i++){const w=base-(i*(base-70)/tiers),y=360-(i+1)*th,x=(W-w)/2,w2=base-((i+1)*(base-70)/tiers),x2=(W-w2)/2;
        sv+=`<polygon points="${x},${y+th} ${x+w},${y+th} ${x2+w2},${y} ${x2},${y}" fill="${p[i%3]}" stroke="#1b2238" stroke-width="2"/>`;
        const n=Math.max(2,Math.floor(w2/26));for(let j=0;j<n;j++){const cx=x2+(j+.5)*(w2/n);sv+=`<rect x="${cx-4}" y="${y+th*.25}" width="8" height="${th*.55}" rx="3" fill="#1b2238" opacity=".55"/>`}}
      const ty=360-tiers*th,wt=base-(base-70);const tx=(W-wt)/2;
      sv+=`<path d="M${tx-6},${ty} Q${W/2},${ty-40} ${tx+wt+6},${ty}Z" fill="${p[0]}" stroke="#1b2238" stroke-width="2"/>`;
      for(let j=0;j<5;j++){const cx=tx+8+j*((wt-16)/4);sv+=`<circle cx="${cx}" cy="${ty-24+Math.abs(j-2)*6}" r="5" fill="#f2b134" stroke="#1b2238"/>`}
      sv+=`<rect x="${W/2-18}" y="${330}" width="36" height="${30}" rx="14" fill="#141a2c"/>`;
      el.innerHTML=head()+`<div class="gop"><svg viewBox="0 0 260 370" role="img" aria-label="Gopuram with ${tiers} tiers">${sv}</svg><div class="ctl"><label for="gtiers">Tiers: <b>${tiers}</b></label><input id="gtiers" type="range" min="3" max="11" value="${tiers}"><span>Colors</span><div class="swatches">${PAL.map((x,i)=>`<button data-c="${i}" aria-pressed="${i===col}" aria-label="Palette ${i+1}" style="background:linear-gradient(135deg,${x[0]} 50%,${x[1]} 50%)"></button>`).join("")}</div><span class="note-sm" style="color:var(--smuted)">Count the repeating shapes!</span></div></div>`;
      el.querySelector("#greset").onclick=()=>{tiers=6;col=0;draw()};
      el.querySelector("#gtiers").oninput=e=>{tiers=+e.target.value;draw();el.querySelector("#gtiers").focus()};
      el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{col=+b.dataset.c;draw()})};draw();return}
  const r=el.querySelector("#greset");if(r)r.onclick=reset;
}

/* ---------- Quiz ---------- */
function runQuiz(s,el){
  const qs=s.quiz.map(([q,c,w,why])=>{const opts=shuffle([c,...w],hash(q));return{q,opts,ans:opts.indexOf(c),why}});
  let i=0,score=0,answered=false;const L="ABCD";
  const draw=()=>{if(i>=qs.length){el.innerHTML=`<p class="qq">You scored ${score} of ${qs.length}!</p><p class="s-sub">${score===qs.length?"Perfect! Stamp those passports.":"Great effort. Let’s review the ones we missed."}</p><div class="qnav"><button class="gbtn" id="qagain">Play again</button></div>`;$("#qagain",el).onclick=()=>{i=0;score=0;draw()};return}
    const q=qs[i];answered=false;
    el.innerHTML=`<div class="qn">Question ${i+1} of ${qs.length}</div><p class="qq">${esc(q.q)}</p><div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${L[j]}</span><span>${esc(o)}</span></button>`).join("")}</div><p class="why" id="why" aria-live="polite"></p><div class="qnav"><button class="gbtn" id="qnext" hidden>${i===qs.length-1?"See score":"Next question →"}</button><span class="score">Score ${score}</span></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const j=+b.dataset.j;
      el.querySelectorAll(".opt")[q.ans].classList.add("ok");if(j!==q.ans)b.classList.add("no");else score++;
      $("#why",el).textContent=(j===q.ans?"Correct! ":"Answer: "+q.opts[q.ans]+". ")+q.why;
      $(".score",el).textContent="Score "+score;const n=$("#qnext",el);n.hidden=false;n.focus();n.onclick=()=>{i++;draw()}})};
  draw();
}

/* ---------- Shell ---------- */
function render(){
  const sel=$("#clsSel");sel.value=state.view==="class"?String(state.si):"";
  if(state.view==="home")renderHome();else renderClass();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.view="class";state.si=+b.dataset.go;state.slide=0;render();window.scrollTo({top:0})});
}
function init(){
  $("#clsSel").innerHTML=`<option value="">All classes · calendar</option>`+S.map((s,i)=>`<option value="${i}">${pd(s.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})} · Class ${s.cls}: ${esc(s.title)}</option>`).join("");
  $("#clsSel").onchange=e=>{if(e.target.value===""){state.view="home"}else{state.view="class";state.si=+e.target.value;state.slide=0}render()};
  $("#brand").onclick=()=>{state.view="home";render()};
  document.addEventListener("keydown",e=>{if(state.view!=="class")return;const t=e.target.tagName;if(t==="INPUT"||t==="SELECT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(state.slide+1)}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(state.slide-1)}});
  render();
}
init();
</script>
</body></html>
