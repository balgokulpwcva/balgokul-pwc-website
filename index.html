<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bal Gokul of Prince William County</title>
<meta name="description" content="Hindu cultural Sunday school for children in Haymarket, Virginia. Classes every Sunday, 10:00-11:30 am at Alvey Elementary School.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Karla:ital,wght@0,300..800;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF9F0; --surface:#FFFFFF; --surface-2:#FDF3E3;
  --ink:#17233F; --ink-soft:#535E7A; --line:#E9DFCD;
  --gold:#C9820F; --gold-bg:#FBEDD3; --peacock:#0E6B5C; --peacock-bg:#E2F0EC;
  --berry:#A3285B; --berry-bg:#F9E6ED;
  --shadow:0 1px 0 rgba(23,35,63,.04), 0 10px 30px -18px rgba(23,35,63,.35);
  --r:14px; --maxw:1120px;
  color-scheme:light;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101628; --surface:#182034; --surface-2:#1F2942;
    --ink:#F2EADD; --ink-soft:#AFB8CC; --line:#2E3A56;
    --gold:#EDB552; --gold-bg:#2C2415; --peacock:#5CC6AE; --peacock-bg:#16302B;
    --berry:#EE8FB2; --berry-bg:#331A25;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101628; --surface:#182034; --surface-2:#1F2942;
  --ink:#F2EADD; --ink-soft:#AFB8CC; --line:#2E3A56;
  --gold:#EDB552; --gold-bg:#2C2415; --peacock:#5CC6AE; --peacock-bg:#16302B;
  --berry:#EE8FB2; --berry-bg:#331A25;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Karla,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; font-weight:400;
}
img{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}

h1,h2,h3,h4{font-family:"Tiro Devanagari Hindi",Georgia,"Times New Roman",serif; font-weight:400; line-height:1.18; margin:0}
h1{font-size:clamp(2.3rem,6vw,3.9rem); letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}
h3{font-size:1.28rem}
h4{font-size:1.06rem}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}
.narrow{max-width:68ch}
.section{padding:58px 0}
.section + .section{border-top:1px solid var(--line)}
.eyebrow{font-size:.9rem; color:var(--peacock); font-weight:700; margin:0 0 .5rem}
.lede{font-size:1.12rem; color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.skip{position:absolute; left:-9999px; top:0; background:var(--surface); padding:10px 16px; z-index:100}
.skip:focus{left:12px; top:12px}
header.site{position:sticky; top:0; z-index:40; background:var(--paper); background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:16px; min-height:70px}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none; flex:0 0 auto}
.brand .mark{width:46px; height:46px; flex:0 0 auto; display:grid; place-items:center}
.brand .mark img{width:100%;height:100%;object-fit:contain}
.brand b{font-family:"Tiro Devanagari Hindi",Georgia,serif; font-weight:400; font-size:1.18rem; display:block; line-height:1.15}
.brand small{display:block; font-size:.76rem; color:var(--ink-soft); letter-spacing:.02em}
nav.main{margin-left:auto; display:flex; align-items:center; gap:2px}
nav.main a{
  text-decoration:none; font-size:.95rem; padding:9px 11px; border-radius:9px; color:var(--ink-soft);
  white-space:nowrap; transition:background .15s,color .15s;
}
nav.main a:hover{background:var(--surface-2); color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink); font-weight:700; background:var(--gold-bg)}
.btn{
  display:inline-flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer;
  font:inherit; font-weight:700; font-size:.95rem; padding:11px 18px; border-radius:999px;
  border:1px solid transparent; background:var(--ink); color:var(--paper); transition:transform .12s, filter .15s;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold); color:#1B1405}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 13px; font-size:.85rem}
.menu-toggle{display:none; margin-left:auto; background:none; border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; color:inherit; font:inherit}
@media (max-width:940px){
  nav.main{
    position:fixed; inset:70px 0 auto 0; flex-direction:column; align-items:stretch; gap:0;
    background:var(--surface); border-bottom:1px solid var(--line); padding:10px 14px 18px;
    transform:translateY(-140%); transition:transform .22s ease; box-shadow:var(--shadow); margin:0;
  }
  nav.main.open{transform:none}
  nav.main a{padding:13px 10px; font-size:1.05rem; border-bottom:1px solid var(--line)}
  nav.main .btn{margin-top:12px; justify-content:center}
  .menu-toggle{display:block}
}

/* ---------- hero ---------- */
.hero{position:relative; overflow:hidden; border-bottom:1px solid var(--line)}
.hero .kolam{position:absolute; inset:0; opacity:.5; pointer-events:none}
.hero-inner{position:relative; padding:66px 0 54px; display:grid; grid-template-columns:1.35fr .9fr; gap:46px; align-items:start}
@media (max-width:880px){.hero-inner{grid-template-columns:1fr; gap:30px; padding:44px 0 40px}}
.hero h1{margin-bottom:.45em; max-width:16ch}
.hero .lede{max-width:46ch}
.hero-cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.nextclass{padding:22px 24px}
.nextclass h3{font-size:1.05rem; font-family:Karla,sans-serif; font-weight:800; letter-spacing:.01em}
.nextclass .big{font-family:"Tiro Devanagari Hindi",Georgia,serif; font-size:1.75rem; line-height:1.2; margin:.3em 0 .2em; color:var(--berry)}
.nextclass dl{margin:16px 0 0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:.95rem}
.nextclass dt{color:var(--ink-soft)}
.nextclass dd{margin:0}
.announce{background:var(--peacock-bg); border-bottom:1px solid var(--line)}
.announce .wrap{display:flex; gap:14px; align-items:center; padding-top:12px; padding-bottom:12px; font-size:.96rem}
.announce .dot{width:9px;height:9px;border-radius:50%;background:var(--peacock);flex:0 0 auto}

/* ---------- generic blocks ---------- */
.grid{display:grid; gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tile{padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.tile h3{margin-bottom:.4em}
.tile ul{margin:.7em 0 0; padding-left:1.1em}
.tile li{margin:.25em 0}
.sub{font-size:.86rem; font-weight:700; color:var(--peacock); margin:1.1em 0 .3em}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap}
.section-head p{max-width:56ch; margin:.5em 0 0}
.rich{white-space:pre-wrap}

/* curriculum accordion */
.acc{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.acc + .acc{margin-top:12px}
.acc summary{cursor:pointer; padding:18px 22px; font-family:"Tiro Devanagari Hindi",Georgia,serif; font-size:1.2rem; display:flex; align-items:center; gap:12px; list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+"; margin-left:auto; font-family:Karla,sans-serif; font-size:1.4rem; color:var(--gold); line-height:1}
.acc[open] summary::after{content:"\2013"}
.acc .body{padding:0 22px 22px; border-top:1px solid var(--line); padding-top:18px}
.acc .body .cols{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:14px}
@media (max-width:620px){.acc .body .cols{grid-template-columns:1fr}}

/* calendar */
.cal{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media (max-width:900px){.cal{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.cal{grid-template-columns:1fr}}
.month{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px}
.month h3{font-family:Karla,sans-serif; font-size:1rem; font-weight:800; letter-spacing:.02em; margin-bottom:.6em; padding-bottom:.5em; border-bottom:1px solid var(--line)}
.month ul{list-style:none; margin:0; padding:0}
.month li{position:relative; padding-left:16px; margin:.45em 0; font-size:.94rem; color:var(--ink-soft)}
.month li::before{content:""; position:absolute; left:0; top:.62em; width:6px; height:6px; border-radius:50%; background:var(--line)}
.month li.key{color:var(--ink); font-weight:700}
.month li.key::before{background:var(--gold)}

/* events */
.event{display:grid; grid-template-columns:132px 1fr; gap:24px; padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.event + .event{margin-top:16px}
@media (max-width:620px){.event{grid-template-columns:1fr; gap:14px}}
.datechip{background:var(--berry-bg); border-radius:12px; padding:14px 10px; text-align:center; align-self:start}
.datechip .m{font-size:.8rem; font-weight:800; color:var(--berry); letter-spacing:.06em; text-transform:uppercase}
.datechip .d{font-family:"Tiro Devanagari Hindi",Georgia,serif; font-size:2.1rem; line-height:1.05}
.datechip .y{font-size:.78rem; color:var(--ink-soft)}
.meta{display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--ink-soft); font-size:.93rem; margin:.35em 0 .8em}
.tag{display:inline-block; font-size:.75rem; font-weight:800; letter-spacing:.04em; padding:3px 9px; border-radius:999px; background:var(--gold-bg); color:var(--gold)}
.event.past{opacity:.72}

/* gallery */
.albums{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
@media (max-width:900px){.albums{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.albums{grid-template-columns:1fr}}
.album{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface); text-align:left; padding:0; font:inherit; color:inherit; cursor:pointer; display:block; width:100%}
.album .cover{aspect-ratio:4/3; background:var(--surface-2); display:grid; place-items:center; overflow:hidden}
.album .cover img{width:100%; height:100%; object-fit:cover}
.album .cap{padding:15px 17px}
.album .cap h3{font-size:1.1rem}
.album:hover .cover img{filter:brightness(1.05)}
.photos{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px}
.photo{position:relative; aspect-ratio:1; border-radius:11px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); padding:0; cursor:zoom-in}
.photo img{width:100%; height:100%; object-fit:cover}
.empty{border:1px dashed var(--line); border-radius:var(--r); padding:44px 26px; text-align:center; color:var(--ink-soft); background:var(--surface)}
.empty h3{color:var(--ink); margin-bottom:.4em}
#lightbox{position:fixed; inset:0; z-index:90; background:rgba(9,12,22,.93); display:none; place-items:center}
#lightbox.on{display:grid}
#lightbox img{max-width:92vw; max-height:80vh; object-fit:contain; border-radius:8px}
#lightbox .cap{color:#F2EADD; text-align:center; margin-top:14px; font-size:.95rem; max-width:70ch; padding:0 20px}
#lightbox button{position:absolute; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25); width:46px; height:46px; border-radius:50%; font-size:1.3rem; cursor:pointer}
#lb-prev{left:14px; top:50%; transform:translateY(-50%)}
#lb-next{right:14px; top:50%; transform:translateY(-50%)}
#lb-close{right:14px; top:14px}

/* timeline for past themes */
.tl{list-style:none; margin:0; padding:0; border-left:2px solid var(--line)}
.tl li{position:relative; padding:0 0 22px 26px}
.tl li::before{content:""; position:absolute; left:-7px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--gold); border:2px solid var(--paper)}
.tl h4{font-family:Karla,sans-serif; font-weight:800; font-size:1rem}

/* footer */
footer.site{background:var(--surface-2); border-top:1px solid var(--line); margin-top:10px; padding:44px 0 30px; font-size:.95rem}
footer.site .cols{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:30px}
@media (max-width:760px){footer.site .cols{grid-template-columns:1fr; gap:22px}}
footer.site h4{font-family:Karla,sans-serif; font-weight:800; font-size:.9rem; letter-spacing:.04em; margin-bottom:.7em}
footer.site a{color:var(--ink-soft); text-decoration:none; display:block; padding:3px 0}
footer.site a:hover{color:var(--ink); text-decoration:underline}
footer.site .flogo{width:178px; height:auto; margin:0 0 16px}
.legal .vihar{width:86px; height:auto; flex:0 0 auto}
.legal{margin-top:30px; padding-top:18px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:.85rem; display:flex; gap:18px; flex-wrap:wrap; align-items:center}

/* ---------- editor ---------- */
#adminbar{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:80;
  display:flex; align-items:center; gap:10px; padding:9px 10px 9px 16px;
  background:var(--ink); color:var(--paper); border-radius:999px; box-shadow:0 14px 40px -12px rgba(0,0,0,.6);
  font-size:.9rem; max-width:calc(100vw - 24px);
}
#adminbar .btn{padding:8px 14px; font-size:.85rem}
#adminbar .btn.ghost{color:var(--paper); border-color:rgba(255,255,255,.3)}
#adminbar .btn.ghost:hover{background:rgba(255,255,255,.12)}
#adminbar .status{opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
body.editing [data-bind]{
  outline:1px dashed color-mix(in srgb,var(--peacock) 60%, transparent); outline-offset:3px; border-radius:3px; min-width:1ch; min-height:1em;
}
body.editing [data-bind]:focus{outline:2px solid var(--peacock); background:var(--peacock-bg)}
body.editing [data-bind]:empty::after{content:attr(data-ph); color:var(--ink-soft); opacity:.7}
.ctrls{display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap}
body:not(.editing) .ctrls, body:not(.editing) .editonly{display:none!important}
.ictrl{
  font:inherit; font-size:.78rem; font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
}
.ictrl:hover{background:var(--surface-2); color:var(--ink)}
.ictrl.danger:hover{background:var(--berry-bg); color:var(--berry); border-color:var(--berry)}
.toast{
  position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:95;
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:10px; font-size:.9rem;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.on{opacity:1}
dialog{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); color:var(--ink); padding:0; max-width:min(560px,92vw); box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(9,12,22,.5)}
dialog .dlg{padding:24px}
dialog h3{margin-bottom:.6em}
dialog label{display:block; font-size:.85rem; font-weight:700; margin:14px 0 5px}
dialog input[type=text],dialog input[type=url],dialog textarea,dialog input[type=file]{
  width:100%; font:inherit; font-size:.95rem; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
dialog .row{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
.uploading{font-size:.85rem; color:var(--peacock); margin-top:10px}
.overflow{overflow-x:auto}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site">
  <div class="wrap bar">
    <a class="brand" href="#/">
      <span class="mark" id="brandmark"></span>
      <span>
        <b data-bind="site.name">Bal Gokul</b>
        <small data-bind="site.place">Prince William County, Virginia</small>
      </span>
    </a>
    <button class="menu-toggle" id="menubtn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="main" id="nav" aria-label="Main"></nav>
  </div>
</header>

<div id="announce"></div>
<main id="main" tabindex="-1"></main>
<footer class="site" id="foot"></footer>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div>
    <img id="lb-img" alt="">
    <div class="cap" id="lb-cap"></div>
  </div>
  <button id="lb-prev" aria-label="Previous photo">&#8249;</button>
  <button id="lb-next" aria-label="Next photo">&#8250;</button>
  <button id="lb-close" aria-label="Close">&times;</button>
</div>

<div id="adminbar" hidden>
  <span class="status" id="editstatus">Viewing</span>
  <button class="btn gold sm" id="editbtn">Edit site</button>
  <button class="btn ghost sm" id="savebtn" hidden>Save changes</button>
  <button class="btn ghost sm" id="cancelbtn" hidden>Discard</button>
  <button class="btn ghost sm" id="exportbtn" hidden>Export</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

let content = deepClone(SEED);
let editing = false, dirty = false, db = null, assets = null, canEdit = false, unsub = null;

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

function get(path, obj){
  return String(path).split(".").reduce((o,k)=> (o==null?undefined:o[k]), obj||content);
}
function setAt(path, value){
  const keys = String(path).split(".");
  let o = content;
  for (let i=0;i<keys.length-1;i++){ if(o[keys[i]]==null) o[keys[i]] = {}; o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}

/* an editable field */
function F(path, opts){
  opts = opts || {};
  const tag = opts.tag || "span";
  const cls = [opts.cls||"", opts.rich?"rich":""].filter(Boolean).join(" ");
  const v = get(path);
  return `<${tag}${cls?` class="${cls}"`:""} data-bind="${esc(path)}" data-ph="${esc(opts.ph||"Add text")}">${esc(v==null?"":v)}</${tag}>`;
}
function listCtrl(path,i,len){
  return `<div class="ctrls editonly">
    <button class="ictrl" data-act="up" data-list="${esc(path)}" data-i="${i}"${i===0?" disabled":""} aria-label="Move up">&#8593;</button>
    <button class="ictrl" data-act="down" data-list="${esc(path)}" data-i="${i}"${i===len-1?" disabled":""} aria-label="Move down">&#8595;</button>
    <button class="ictrl danger" data-act="del" data-list="${esc(path)}" data-i="${i}">Remove</button>
  </div>`;
}
function addCtrl(path, kind, label){
  return `<div class="ctrls editonly"><button class="ictrl" data-act="add" data-list="${esc(path)}" data-kind="${esc(kind)}">+ ${esc(label)}</button></div>`;
}

function fmtDate(iso, opts){
  if(!iso) return "";
  const d = new Date(iso + (iso.length===10 ? "T12:00:00" : ""));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", opts || { month:"long", day:"numeric", year:"numeric" });
}
function isUpcoming(iso){
  if(!iso) return false;
  const d = new Date(iso + "T23:59:59");
  return !isNaN(d) && d >= new Date();
}
function photoSrc(p){
  if(!p) return "";
  if(p.url) return p.url;
  if(p.asset) return "/_blob/" + p.asset;
  return "";
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.remove("on"), 2600);
}

function nextClassCard(){
  const dates = (content.classDates||[]).filter(isUpcoming).sort();
  const big = dates.length ? fmtDate(dates[0], { weekday:"long", month:"long", day:"numeric" }) : "Resuming this fall";
  return `<div class="card nextclass">
    <h3>Sunday classes</h3>
    <div class="big">${esc(big)}</div>
    <dl>
      <dt>Time</dt><dd>${F("site.classTime")}</dd>
      <dt>Where</dt><dd>${F("site.venue")}<br><span class="muted">${F("site.address")}</span></dd>
      <dt>Who</dt><dd>Kindergarten through grade 12</dd>
    </dl>
    <div style="margin-top:18px"><a class="btn gold" href="${esc(content.site.registerUrl)}" target="_blank" rel="noopener">Register your child</a></div>
  </div>`;
}

function viewHome(){
  const upcoming = (content.events||[]).map((e,i)=>({e,i})).filter(x=>isUpcoming(x.e.date))
    .sort((a,b)=> a.e.date.localeCompare(b.e.date)).slice(0,2);
  const albums = (content.gallery.albums||[]).slice(0,3);
  return `
  <section class="hero">
    ${KOLAM}
    <div class="wrap hero-inner">
      <div>
        <h1>${F("hero.heading", {ph:"Headline"})}</h1>
        <p class="lede rich">${F("hero.body", {rich:true, ph:"Introduce the program"})}</p>
        <div class="hero-cta">
          <a class="btn" href="#/register">${F("hero.ctaLabel")}</a>
          <a class="btn ghost" href="#/contact">${F("hero.cta2Label")}</a>
        </div>
      </div>
      ${nextClassCard()}
    </div>
  </section>

  <section class="section"><div class="wrap">
    <div class="grid g3" data-listwrap>
      ${(content.highlights||[]).map((h,i)=>`<div class="tile">
        <h3>${F("highlights."+i+".title")}</h3>
        <p class="rich">${F("highlights."+i+".body", {rich:true})}</p>
        ${listCtrl("highlights", i, content.highlights.length)}
      </div>`).join("")}
    </div>
    ${addCtrl("highlights","highlight","Add a card")}
  </div></section>

  <section class="section"><div class="wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow">This year</p>
        <h2>${F("theme.title")}</h2>
        <p class="rich">${F("theme.intro", {rich:true})}</p>
      </div>
      <a class="btn ghost" href="#/classes">See the curriculum</a>
    </div>
    <div class="grid g4">
      ${(content.theme.explore||[]).map((x,i)=>`<div class="tile">
        <h4>${F("theme.explore."+i+".title")}</h4>
        <p class="muted rich">${F("theme.explore."+i+".body",{rich:true})}</p>
      </div>`).join("")}
    </div>
  </div></section>

  ${upcoming.length ? `<section class="section"><div class="wrap">
    <div class="section-head"><h2>Coming up</h2><a class="btn ghost" href="#/events">All events</a></div>
    ${upcoming.map(x=> eventCard(x.e, x.i, false)).join("")}
  </div></section>` : ""}

  <section class="section"><div class="wrap">
    <div class="section-head"><h2>From the album</h2><a class="btn ghost" href="#/gallery">Open the gallery</a></div>
    ${albums.length ? `<div class="albums">${albums.map(a=>albumCard(a)).join("")}</div>`
      : `<div class="empty"><h3>No photos yet</h3><p>Photos from class, festivals and events will appear here. An editor can add the first album from the gallery page.</p></div>`}
  </div></section>`;
}

function viewAbout(){
  return `<section class="section"><div class="wrap">
    <p class="eyebrow">About</p>
    <h2>What Bal Gokul is</h2>
    <p class="lede narrow rich" style="margin-top:.7em">${F("about.mission",{rich:true})}</p>

    <div class="grid g2" style="margin-top:34px">
      <div class="tile">

function eventCard(e, i, past){

  const chip = d && !isNaN(d) ? `<div class="datechip">

      <div class="d">${d.getDate()}</div>
      <div class="y">${d.getFullYear()}</div>
    </div>` : `<div class="datechip"><div class="m">Date</div><div class="d">TBA</div></div>`;
  return `<article class="event${past?" past":""}">
    ${chip}
    <div>
      ${past?'<span class="tag">Past event</span>':""}
      <h3 style="margin-top:.3em">${F("events."+i+".title")}</h3>
      <div class="meta">
        <span>${F("events."+i+".date",{ph:"YYYY-MM-DD"})}</span>

      ${(e.bullets&&e.bullets.length)?`<ul>${e.bullets.map((b,j)=>`<li>${F("events."+i+".bullets."+j)}${editing?` <button class="ictrl danger editonly" data-act="del" data-list="events.${i}.bullets" data-i="${j}">&times;</button>`:""}</li>`).join("")}</ul>`:""}
      ${addCtrl("events."+i+".bullets","text","Add a detail")}
      ${(e.ctaUrl && e.ctaLabel && !past)?`<p style="margin-top:16px"><a class="btn gold" href="${esc(e.ctaUrl)}" target="_blank" rel="noopener">${esc(e.ctaLabel)}</a></p>`:""}

function viewEvents(){
  const all = (content.events||[]).map((e,i)=>({e,i}));

  { id:"home",     label:"Home",        view:viewHome },
  { id:"about",    label:"About",       view:viewAbout },
  { id:"classes",  label:"Classes",     view:viewClasses },
  { id:"calendar", label:"Calendar",    view:viewCalendar },
  { id:"events",   label:"Events",      view:viewEvents },
  { id:"gallery",  label:"Gallery",     view:viewGallery },
  { id:"involved", label:"Get involved",view:viewInvolved },
  { id:"contact",  label:"Contact",     view:viewContact },
  { id:"register", label:"Register",    view:viewRegister, hide:true },
  { id:"privacy",  label:"Privacy",     view:viewPrivacy,  hide:true }
];

/* ============================================================
   4. ROUTER AND RENDERING
   ============================================================ */
function parseHash(){
  const raw = (location.hash || "#/").replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  const id = parts[0] || "home";
  return { id: ROUTES.some(r=>r.id===id) ? id : "home", arg: parts[1] || null };
}

function renderNav(current){
  const nav = $("#nav");
  nav.innerHTML = ROUTES.filter(r=>!r.hide).map(r =>
    `<a href="#/${r.id === "home" ? "" : r.id}"${r.id===current?' aria-current="page"':""}>${esc(r.label)}</a>`
  ).join("") + `<a class="btn gold" href="#/register" style="margin-left:8px">Register</a>`;
}

  $("#foot").innerHTML = `<div class="wrap">

        <p class="muted" style="max-width:40ch">${esc(s.tagline)}</p>
        <p class="muted" style="margin-top:12px">${esc(s.venue)}<br>${esc(s.address)}<br>${esc(s.classTime)}</p>
      </div>
      <div>

        ${ROUTES.filter(r=>!r.hide && r.id!=="home").map(r=>`<a href="#/${r.id}">${esc(r.label)}</a>`).join("")}
      </div>
      <div>
        <h4>Reach us</h4>
        <a href="mailto:${esc(s.email)}">${esc(s.email)}</a>

function renderBrand(){
  const el = $("#brandmark");
  el.innerHTML = content.site.logoAsset
    ? `<img src="/_blob/${esc(content.site.logoAsset)}" alt="">`
    : `<img src="${LOGO.seal}" alt="">`;
}

function render(keepScroll){
  const { id, arg } = parseHash();
  const route = ROUTES.find(r=>r.id===id) || ROUTES[0];
  const y = window.scrollY;
  renderNav(id);
  renderBrand();
  $("#main").innerHTML = route.view(arg);
  renderAnnounce();
  renderFooter();
  applyEditable();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  document.title = (id === "home" ? "" : route.label + " — ") + content.site.name + " of " + content.site.place;
}

function renderAnnounce(){
  const a = content.announcement || {};
  const host = $("#announce");
  if (!a.show && !editing){ host.innerHTML = ""; host.className=""; return; }
  host.className = "announce";
  host.innerHTML = `<div class="wrap">
    <span class="dot"></span>
    <span class="rich" style="flex:1">${F("announcement.text",{rich:true, ph:"Announcement"})}</span>
    ${a.linkUrl?`<a class="btn sm gold" href="${esc(a.linkUrl)}" target="_blank" rel="noopener">${esc(a.linkLabel||"Open")}</a>`:""}
    <span class="ctrls editonly" style="margin:0">
      <button class="ictrl" data-act="setfield" data-path="announcement.linkUrl" data-label="Announcement link">Link…</button>
      <button class="ictrl" data-act="toggleannounce">${a.show?"Hide banner":"Show banner"}</button>
    </span>
  </div>`;
}

/* ============================================================
   5. EDITING
   ============================================================ */
function applyEditable(){
  document.body.classList.toggle("editing", editing);
  $$("[data-bind]").forEach(el => {
    if (editing){ el.setAttribute("contenteditable","true"); el.setAttribute("spellcheck","true"); }
    else el.removeAttribute("contenteditable");
  });
  $("#editbtn").hidden = editing;
  $("#savebtn").hidden = !editing;
  $("#cancelbtn").hidden = !editing;
  $("#exportbtn").hidden = !editing;
  $("#editstatus").textContent = editing
    ? (dirty ? "Unsaved changes" : "Editing — click any text")
    : (canEdit ? "You can edit this site" : "");
}

document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-bind]");
  if (!el || !editing) return;
  setAt(el.getAttribute("data-bind"), el.innerText.replace(/\u00a0/g," "));
  dirty = true;
  $("#editstatus").textContent = "Unsaved changes";
});

document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest("[data-bind]");
  if (el && editing && e.key === "Enter" && !el.classList.contains("rich")){ e.preventDefault(); el.blur(); }
  if (e.key === "Escape" && $("#lightbox").classList.contains("on")) closeLB();
});

document.addEventListener("paste", e => {
  const el = e.target.closest && e.target.closest("[data-bind]");
  if (!el || !editing) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, text);
});

function listAt(path){
  const arr = get(path);
  return Array.isArray(arr) ? arr : null;
}

document.addEventListener("click", async e => {
  if (editing){
    const sum = e.target.closest("summary");
    if (sum && e.target.closest("[data-bind]")) e.preventDefault();   // edit the title, don't toggle
  }
  const act = e.target.closest("[data-act]");
  if (act){
    e.preventDefault();
    await handleAction(act);
    return;
  }
  const album = e.target.closest(".album");
  if (album){ location.hash = "#/gallery/" + album.getAttribute("data-album"); return; }
  const ph = e.target.closest(".photo");
  if (ph){ openLB(+ph.getAttribute("data-lb"), +ph.getAttribute("data-j")); return; }
});

async function handleAction(el){
  const a = el.getAttribute("data-act");
  const listPath = el.getAttribute("data-list");
  const i = +el.getAttribute("data-i");

  if (a === "add"){
    const arr = listAt(listPath);
    if (!arr) { setAt(listPath, []); }
    const target = listAt(listPath);
    target.push(TEMPLATES[el.getAttribute("data-kind")]());
    dirty = true; render(true); return;
  }
  if (a === "del"){
    const arr = listAt(listPath); if (!arr) return;
    if (!confirm("Remove this item?")) return;
    arr.splice(i,1); dirty = true;
    if (listPath === "gallery.albums") location.hash = "#/gallery";
    render(true); return;
  }
  if (a === "up" || a === "down"){
    const arr = listAt(listPath); if (!arr) return;
    const j = a === "up" ? i-1 : i+1;
    if (j < 0 || j >= arr.length) return;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    dirty = true; render(true); return;
  }
  if (a === "togglekey"){
    const arr = listAt(listPath); if (!arr) return;
    arr[i].k = !arr[i].k; dirty = true; render(true); return;
  }
  if (a === "toggleannounce"){
    content.announcement.show = !content.announcement.show; dirty = true; render(true); return;
  }
  if (a === "setfield"){
    const path = el.getAttribute("data-path");
    const val = await ask(el.getAttribute("data-label") || "Value", get(path) || "");
    if (val !== null){ setAt(path, val); dirty = true; render(true); }
    return;
  }
  if (a === "link"){
    const path = el.getAttribute("data-path");
    const label = await ask("Button label (leave blank for no button)", get(path+".ctaLabel") || "");
    if (label === null) return;
    const url = await ask("Button link", get(path+".ctaUrl") || "");
    if (url === null) return;
    setAt(path+".ctaLabel", label); setAt(path+".ctaUrl", url);
    dirty = true; render(true); return;
  }
  if (a === "upload"){
    const idx = +el.getAttribute("data-album");
    await uploadPhotos(idx); return;
  }
  if (a === "photourl"){
    const idx = +el.getAttribute("data-album");
    const url = await ask("Image link (https://…)", "");
    if (!url) return;
    const cap = await ask("Caption (optional)", "");
    content.gallery.albums[idx].photos.push({ url, caption: cap || "" });
    dirty = true; render(true); return;
  }
  if (a === "delphoto"){
    const idx = +el.getAttribute("data-album");
    const j = +el.getAttribute("data-i");
    if (!confirm("Remove this photo?")) return;
    content.gallery.albums[idx].photos.splice(j,1);
    dirty = true; render(true); return;
  }
  if (a === "logo"){ await uploadSingle("site.logoAsset", "logo"); return; }
  if (a === "qr"){ await uploadSingle("register.qrAsset", "QR code"); return; }
}

/* --- dialogs --- */
function ask(label, value){
  return new Promise(resolve => {
    const dlg = $("#dlg");
    $("#dlgbody").innerHTML = `<h3>${esc(label)}</h3>
      <input type="text" id="askinput" value="${esc(value)}">
      <div class="row"><button class="btn ghost" id="askno">Cancel</button><button class="btn" id="askyes">Save</button></div>`;
    dlg.showModal();
    const input = $("#askinput"); input.focus(); input.select();
    const done = v => { dlg.close(); resolve(v); };
    $("#askno").onclick = () => done(null);
    $("#askyes").onclick = () => done(input.value.trim());
    input.onkeydown = ev => { if (ev.key === "Enter") done(input.value.trim()); };
  });
}

async function uploadPhotos(albumIdx){
  if (!assets){ toast("Uploads are not available in this view"); return; }
  const files = await pickFiles(true);
  if (!files || !files.length) return;
  toast("Uploading " + files.length + " photo" + (files.length>1?"s":"") + "…");
  let ok = 0;
  for (const f of files){
    try {
      const res = await assets.upload(f);
      content.gallery.albums[albumIdx].photos.push({ asset: res.id, caption: "" });
      ok++;
    } catch (err){ console.warn(err); }
  }
  dirty = true; render(true);
  toast(ok ? ok + " photo" + (ok>1?"s":"") + " added — remember to save" : "Upload failed");
}

async function uploadSingle(path, what){
  if (!assets){ toast("Uploads are not available in this view"); return; }
  const files = await pickFiles(false);
  if (!files || !files.length) return;
  try {
    const res = await assets.upload(files[0]);
    setAt(path, res.id); dirty = true; render(true);
    toast(what.charAt(0).toUpperCase()+what.slice(1)+" added — remember to save");
  } catch (err){ toast("Could not upload that file"); }
}

function pickFiles(multiple){
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.multiple = !!multiple;
    inp.onchange = () => resolve(Array.prototype.slice.call(inp.files));
    inp.click();
  });
}

/* --- lightbox --- */
let lb = { album:0, i:0 };
function currentPhotos(){ return (content.gallery.albums[lb.album] || {}).photos || []; }
function openLB(albumIdx, j){
  lb = { album: albumIdx, i: j };
  showLB(); $("#lightbox").classList.add("on"); $("#lb-close").focus();
}
function showLB(){
  const p = currentPhotos()[lb.i]; if (!p) return;
  $("#lb-img").src = photoSrc(p);
  $("#lb-img").alt = p.caption || "";
  $("#lb-cap").textContent = p.caption || "";
}
function closeLB(){ $("#lightbox").classList.remove("on"); $("#lb-img").src = ""; }
function stepLB(d){
  const n = currentPhotos().length; if (!n) return;
  lb.i = (lb.i + d + n) % n; showLB();
}
$("#lb-close").onclick = closeLB;
$("#lb-prev").onclick = e => { e.stopPropagation(); stepLB(-1); };
$("#lb-next").onclick = e => { e.stopPropagation(); stepLB(1); };
$("#lightbox").onclick = e => { if (e.target.id === "lightbox") closeLB(); };
document.addEventListener("keydown", e => {
  if (!$("#lightbox").classList.contains("on")) return;
  if (e.key === "ArrowLeft") stepLB(-1);
  if (e.key === "ArrowRight") stepLB(1);
});

/* ============================================================
   6. STORAGE — the CMS side
   ============================================================ */
const DOC_PATH = "site/content";
let savedSnapshot = deepClone(SEED);

function mergeSeed(loaded){
  // keep any new seed keys that a stored document predates
  const out = deepClone(SEED);
  Object.keys(loaded || {}).forEach(k => { if (k.charAt(0) !== "_") out[k] = loaded[k]; });
  return out;
}

async function boot(){
  render();
  const use = (window.claude && window.claude.use) ? window.claude.use.bind(window.claude) : null;
  if (use){
    try { db = await use("db"); } catch(e){ db = null; }
    try { assets = await use("assets"); } catch(e){ assets = null; }
  }
  canEdit = !!assets;                        // assets is granted to editors only
  $("#adminbar").hidden = !canEdit && !db;
  if (!canEdit) $("#editbtn").hidden = true;
  applyEditable();

  if (!db){
    $("#editstatus").textContent = "Read-only preview";
    return;
  }
  unsub = db.doc(DOC_PATH).onSnapshot(snap => {
    if (!snap.exists) return;
    const incoming = mergeSeed(snap.data());
    savedSnapshot = deepClone(incoming);
    if (editing && dirty) return;             // never clobber an open edit
    content = incoming;
    render(true);
  }, err => { console.warn("db", err); });
}

async function save(){
  if (!db){ toast("This view cannot save changes"); return; }
  const btn = $("#savebtn"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const body = deepClone(content);
    body._updated = new Date().toISOString();
    await db.doc(DOC_PATH).set(body);
    savedSnapshot = deepClone(content);
    dirty = false; editing = false;
    render(true);
    toast("Saved. Everyone sees the update.");
  } catch (err){
    const code = err && err.code;
    toast(code === "invalid_argument" ? "You do not have edit access to this site" : "Could not save — try again");
  } finally { btn.disabled = false; btn.textContent = "Save changes"; }
}

$("#editbtn").onclick = () => { editing = true; render(true); toast("Click any text to change it"); };
$("#savebtn").onclick = save;
$("#cancelbtn").onclick = () => {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  content = deepClone(savedSnapshot); dirty = false; editing = false; render(true);
};
$("#exportbtn").onclick = async () => {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch(e){}
  if (!dl){ toast("Downloads are not available in this view"); return; }
  try {
    await dl.save({ filename: "balgokul-content.json", data: JSON.stringify(content, null, 2) });
  } catch (err){ if (err && err.code !== "declined") toast("Export failed"); }
};

window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", () => { $("#nav").classList.remove("open"); render(); });
$("#menubtn").onclick = () => {
  const nav = $("#nav"), open = nav.classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};

boot();
</script>
</body>
